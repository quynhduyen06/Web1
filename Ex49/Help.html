<html>
<head>
    <title>Help</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background-color: lightcyan;
        }

        .menu-frame {
            position: relative;
            height: 35px;
            z-index: 9999;
        }

        .menu-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35px;
            border: 0;
        }

        .menu-frame:hover iframe {
            height: 180px;
        }

        h1 {
            color: blue;
        }

        .help-box {
            width: 600px;
            border: 2px solid blue;
            padding: 20px;
            margin: 20px auto;
            background-color: white;
        }
    </style>
</head>

<body>

    <div class="menu-frame">
        <iframe
            src="../index.html"
            scrolling="no">
        </iframe>
    </div>

    <div class="help-box">

        <h1>Online Classified Help</h1>

        <p>Hãy kêu SOS để tôi help bạn</p>

    </div>

</body>
</html>
