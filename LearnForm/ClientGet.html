<html>
<head>
    <title>ClientGet</title>

    <style>
        body {
            margin: 0;
        }

        .menu-frame {
            position: relative;
            height: 35px;
            z-index: 9999;
        }

        .menu-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35px;
            border: 0;
        }

        .menu-frame iframe:hover {
            height: 180px;
        }

        form {
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="menu-frame">
        <iframe
            src="../index.html"
            scrolling="no">
        </iframe>
    </div>

    <form action="ServerGet.html" method="get">

        <table border="1" cellpadding="0" cellspacing="0">

            <tr>
                <td>Nhập tên:</td>
                <td>
                    <input type="text" value="Obama" name="txtten">
                </td>
            </tr>

            <tr>
                <td>Nhập Email:</td>
                <td>
                    <input type="email" value="Obama@gmail.com" name="txtemail">
                </td>
            </tr>

        </table>

        <input type="submit" value="Gửi thông tin">

    </form>

</body>
</html>
